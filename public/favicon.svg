<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e3f"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Crossed swords design -->
  <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Sword 1 (diagonal) -->
    <line x1="8" y1="24" x2="24" y2="8"/>
    <line x1="22" y1="22" x2="24" y2="20"/>
    <circle cx="25" cy="7" r="2" fill="#f59e0b"/>
    <!-- Sword 2 (other diagonal) -->
    <line x1="24" y1="24" x2="8" y2="8"/>
    <line x1="10" y1="22" x2="8" y2="20"/>
    <circle cx="7" cy="7" r="2" fill="#f59e0b"/>
  </g>
  <!-- Center shield -->
  <rect x="13" y="13" width="6" height="7" rx="1" fill="#f59e0b" opacity="0.9"/>
  <!-- Small accent dots -->
  <circle cx="7" cy="25" r="1" fill="#f59e0b" opacity="0.6"/>
  <circle cx="25" cy="25" r="1" fill="#f59e0b" opacity="0.6"/>
</svg>